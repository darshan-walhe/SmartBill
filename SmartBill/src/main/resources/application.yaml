server:
  port: 8080
  error:
    # Explicit, not relying on Spring Boot's defaults staying unchanged —
    # never include exception details/stack traces in error responses.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

spring:
  application:
    name: SmartBill

  data:
    mongodb:
      uri: mongodb://localhost:27017/bcs_billing_db
      auto-index-creation: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# App custom properties
app:
  jwt:
    secret: jdklfnsdfofjfhuhoflks6f1fsgf47ds5ff4f5df4g1g1h5vrt5rwt7t1cvw7tr78r0tw787gdfs2
    expiration-ms: 86400000       # 24 hours
    refresh-expiration-ms: 604800000  # 7 days

  otp:
    expiry-minutes: 10
    length: 6
    # DEV ONLY — when true, the actual OTP is written to logs so you can test
    # without a real SMS gateway. Must be false (or unset) everywhere else —
    # anyone with log access could otherwise log in as any user.
    log-plaintext: ${OTP_LOG_PLAINTEXT:false}

  google:
    client-id: ${GOOGLE_CLIENT_ID:your-google-client-id.apps.googleusercontent.com}

  # First SUPER_ADMIN account, created once on startup by SuperAdminBootstrap
  # if no SUPER_ADMIN exists yet. Leave both unset to skip bootstrap entirely
  # (e.g. on every startup after the first). Unset SUPER_ADMIN_PASSWORD from
  # your environment once the account has been created — it's only read
  # when no SUPER_ADMIN exists yet, so leaving it set afterward does nothing
  # but does needlessly keep a plaintext credential in your env.
  super-admin:
    email: ${SUPER_ADMIN_EMAIL:}
    password: ${SUPER_ADMIN_PASSWORD:}
    name: ${SUPER_ADMIN_NAME:Platform Super Admin}

  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173

logging:
  level:
    com.bcs.billing: DEBUG
    org.springframework.security: INFO